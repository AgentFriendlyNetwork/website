<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Cyan to Electric Blue Gradient -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Purple to Violet Gradient -->
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Tech Background -->
  <rect width="500" height="500" rx="100" fill="url(#bg-grad)" />
  <rect width="496" height="496" x="2" y="2" rx="98" fill="none" stroke="#1F2937" stroke-width="2" />

  <!-- Background Tech Grid / Constellation Lines -->
  <g opacity="0.15" stroke="#00F0FF" stroke-width="1.5">
    <line x1="100" y1="100" x2="400" y2="400" stroke-dasharray="6,6" />
    <line x1="400" y1="100" x2="100" y2="400" stroke-dasharray="6,6" />
    <circle cx="250" cy="250" r="180" fill="none" stroke-dasharray="8,8" />
    <circle cx="250" cy="250" r="120" fill="none" />
  </g>

  <!-- Decentralized Agent Nodes & Mesh Links -->
  <g stroke="url(#neon-cyan)" stroke-width="3.5" opacity="0.8">
    <line x1="250" y1="90" x2="380" y2="170" />
    <line x1="380" y1="170" x2="380" y2="330" />
    <line x1="380" y1="330" x2="250" y2="410" />
    <line x1="250" y1="410" x2="120" y2="330" />
    <line x1="120" y1="330" x2="120" y2="170" />
    <line x1="120" y1="170" x2="250" y2="90" />
    
    <!-- Internal Cross-Mesh Connections -->
    <line x1="250" y1="90" x2="250" y2="250" stroke="url(#neon-purple)" stroke-width="2" />
    <line x1="120" y1="170" x2="250" y2="250" stroke="url(#neon-purple)" stroke-width="2" />
    <line x1="380" y1="170" x2="250" y2="250" stroke="url(#neon-purple)" stroke-width="2" />
    <line x1="120" y1="330" x2="250" y2="250" stroke="url(#neon-purple)" stroke-width="2" />
    <line x1="380" y1="330" x2="250" y2="250" stroke="url(#neon-purple)" stroke-width="2" />
    <line x1="250" y1="410" x2="250" y2="250" stroke="url(#neon-purple)" stroke-width="2" />
  </g>

  <!-- Perimeter Agent Nodes -->
  <g filter="url(#glow-cyan)">
    <circle cx="250" cy="90" r="10" fill="#00F0FF" />
    <circle cx="380" cy="170" r="10" fill="#00F0FF" />
    <circle cx="380" cy="330" r="10" fill="#00F0FF" />
    <circle cx="250" cy="410" r="10" fill="#00F0FF" />
    <circle cx="120" cy="330" r="10" fill="#00F0FF" />
    <circle cx="120" cy="170" r="10" fill="#00F0FF" />
  </g>

  <!-- Central AFN Hexagon Shield & Core Logo Glyph -->
  <g filter="url(#glow-purple)">
    <polygon points="250,150 330,195 330,290 250,335 170,290 170,195" 
             fill="#0F172A" stroke="url(#neon-purple)" stroke-width="5" />
  </g>

  <!-- Center 'A' Futuristic Monogram -->
  <g filter="url(#glow-cyan)">
    <!-- Stylized Lambda / Delta 'A' for Agent Network -->
    <path d="M 250 175 L 305 285 L 275 285 L 250 230 L 225 285 L 195 285 Z" 
          fill="url(#neon-cyan)" />
    <!-- Crossbar / Network Pulse -->
    <circle cx="250" cy="245" r="7" fill="url(#gold-grad)" />
    <line x1="220" y1="262" x2="280" y2="262" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Typography Label: AFN -->
  <text x="250" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" letter-spacing="8">
    AFN
  </text>
  <text x="250" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="600" font-size="12" fill="#9CA3AF" letter-spacing="4">
    AGENT FRIENDLY NETWORK
  </text>
</svg>